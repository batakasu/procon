<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブレッドボード配線ゲーム</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; background:#eef1f4; color:#20252b;
    font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;
  }
  header{
    background:#fff;border-bottom:1px solid #d8dde3;
    padding:14px 20px;display:flex;align-items:center;gap:18px;
    flex-wrap:wrap;
  }
  h1{font-size:20px;margin:0}
  .sub{color:#66717d;font-size:13px}
  .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{
    border:1px solid #bfc7d0;background:#fff;border-radius:8px;
    padding:8px 13px;cursor:pointer;font-weight:600;
  }
  button:hover{background:#f4f6f8}
  #check{background:#1976d2;color:#fff;border-color:#1976d2}
  #check:hover{background:#1565c0}
  main{max-width:1050px;margin:18px auto;padding:0 14px}
  .panel{
    background:#fff;border:1px solid #d8dde3;border-radius:12px;
    padding:14px;box-shadow:0 2px 8px #0000000b;
  }
  #status{
    min-height:32px;padding:7px 10px;margin-bottom:10px;
    border-radius:7px;background:#f4f6f8;font-weight:700;
  }
  #status.ok{background:#e7f6ec;color:#176b35}
  #status.ng{background:#fff0f0;color:#a32929}
  .instructions{font-size:13px;color:#59636e;line-height:1.7;margin:0 0 10px}
  #boardWrap{overflow:auto;border-radius:8px}
  svg{display:block;width:100%;min-width:820px;height:auto;background:#fff}
  svg rect{pointer-events:none}
  svg line{pointer-events:none}
  .hole{fill:#252a2f;stroke:#fff;stroke-width:1.5;cursor:pointer}
  .hole:hover{fill:#1976d2}
  .hole.selected{fill:#ff9800;stroke:#fff;stroke-width:3}
  .wire{stroke:#e53935;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
  .wire:hover{stroke:#b71c1c}
  .ghost{stroke:#ff9800;stroke-width:3;stroke-dasharray:7 6;opacity:.75;fill:none;pointer-events:none}
  .board{fill:#f8f8f7;stroke:#b9b9b5;stroke-width:2}
  .rail{stroke:#d5d5d0;stroke-width:1}
  .terminal{fill:#f7d72b;stroke:#666;stroke-width:1}
  .component{stroke:#555;stroke-width:1.5}
  .resistor{fill:#e7e0c7}
  .switch{fill:#f3e9ad}
  .led{fill:#f00;stroke:#8b0000;stroke-width:2;pointer-events:none}
  .partVisual{pointer-events:none}
  .label{font-size:12px;fill:#333;font-weight:700;pointer-events:none}
  .small{font-size:10px;fill:#6b6b6b;pointer-events:none}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#59636e;margin-top:10px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:4px}
  .red{background:#e53935}.orange{background:#ff9800}.black{background:#252a2f}
  .score{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>🔧 ブレッドボード配線ゲーム</h1>
  <span class="sub">見本の配線図をモデルに、同じ回路を作ろう</span>
  <div class="toolbar">
    <button id="hint">ヒント</button>
    <button id="clear">配線を全部消す</button>
    <button id="check">完成チェック</button>
  </div>
</header>

<main>
  <div class="panel">
    <div id="status">2つの穴を順番にクリックして、配線してください。</div>
    <p class="instructions">
      <b>遊び方：</b> 始点の穴 → 終点の穴の順にクリックします。
      正しい配線なら赤い線が残ります。間違った配線は自動的に取り消されます。
      <b>赤い線をクリックすると、その線を削除</b>できます。
      <span class="score">配線数：<b id="count">0</b> / <b id="total">0</b></span>
    </p>
    <div id="boardWrap">
      <svg id="board" viewBox="0 0 1000 650" aria-label="ブレッドボード"></svg>
    </div>
    <div class="legend">
      <span><i class="dot black"></i>接続穴</span>
      <span><i class="dot red"></i>完成した配線</span>
      <span><i class="dot orange"></i>選択中</span>
    </div>
  </div>
</main>

<script>
(() => {
  const svg = document.getElementById("board");
  const status = document.getElementById("status");
  const countEl = document.getElementById("count");
  const totalEl = document.getElementById("total");

  // -----------------------------
  // ブレッドボードの設定
  // -----------------------------
  const COLS = 25, ROWS = 15;
  const x0 = 70, y0 = 95, dx = 36, dy = 30;
  const X = c => x0 + c*dx;
  const Y = r => y0 + r*dy;

  // 見本画像をモデルにした「正解配線」。
  // 穴番号は (列, 行) で指定。
  // 上下の電源ライン、左右の縦ライン、中央の部品への分岐を再現。
  const solution = [
    [[1,2],[23,2]],    // 上の電源ライン
    [[1,2],[1,13]],    // 左の縦ライン
    [[1,13],[23,13]],  // 下のライン
    [[23,2],[23,13]],  // 右の縦ライン

    [[11,3],[23,3]],   // スイッチ上側
    [[11,3],[11,7]],   // スイッチまで
    [[11,8],[11,13]],  // スイッチ下側

    [[17,4],[23,4]],   // LED上側
    [[17,4],[17,8]],   // LEDまで
    [[17,10],[17,13]], // LED下側

    [[6,2],[6,8]],     // 抵抗上側
    [[6,11],[6,13]]    // 抵抗下側
  ];

  // 重複を除いた正解セット
  const key = p => `${p[0]},${p[1]}`;
  const edgeKey = (a,b) => {
    const A=key(a), B=key(b);
    return A < B ? A+"|"+B : B+"|"+A;
  };
  const solutionMap = new Map();
  for (const [a,b] of solution) solutionMap.set(edgeKey(a,b), [a,b]);

  totalEl.textContent = solutionMap.size;

  const wires = new Map();
  let selected = null;
  let mistakes = 0;
  let hintOn = false;

  // -----------------------------
  // SVG helpers
  // -----------------------------
  function el(name, attrs={}, text=""){
    const e=document.createElementNS("http://www.w3.org/2000/svg",name);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    if(text) e.textContent=text;
    svg.appendChild(e);
    return e;
  }

  // ボード本体
  el("rect",{x:35,y:55,width:930,height:510,rx:12,class:"board"});

  // 上下の穴エリア
  for(let r=0;r<ROWS;r++){
    const yy=Y(r);
    el("line",{x1:55,y1:yy,x2:945,y2:yy,class:"rail"});
  }
  for(let c=0;c<COLS;c++){
    el("line",{x1:X(c),y1:75,x2:X(c),y2:545,class:"rail"});
  }

  // 中央の溝
  el("rect",{x:50,y:Y(7)-12,width:900,height:24,fill:"#ececea"});
  el("line",{x1:50,y1:Y(7),x2:950,y2:Y(7),stroke:"#c7c7c3","stroke-width":2});

  // 穴
  const holeMap = new Map();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const circle=el("circle",{cx:X(c),cy:Y(r),r:5,class:"hole"});
      circle.dataset.c=c; circle.dataset.r=r;
      holeMap.set(key([c,r]),circle);
      circle.addEventListener("click",()=>holeClick([c,r]));
    }
  }

  // 端子列（右側）
  [2,3,4,5].forEach(r=>{
    el("rect",{x:X(23)-9,y:Y(r)-9,width:18,height:18,rx:3,class:"terminal"});
  });

  // 左側の抵抗（見本の位置を簡略再現）
  el("rect",{x:X(1)-7,y:Y(9),width:14,height:72,rx:3,class:"component resistor"});
  el("line",{x1:X(1),y1:Y(8),x2:X(1),y2:Y(9),stroke:"#555","stroke-width":3,class:"partVisual"});
  el("line",{x1:X(1),y1:Y(11.4),x2:X(1),y2:Y(13),stroke:"#555","stroke-width":3,class:"partVisual"});
  el("text",{x:X(1)-23,y:Y(10.6),class:"label"},"抵抗");

  // 中央スイッチ
  el("rect",{x:X(11)-34,y:Y(7)-16,width:68,height:32,rx:6,class:"component switch"});
  el("circle",{cx:X(11)-18,cy:Y(7),r:7,fill:"#777",class:"partVisual"});
  el("circle",{cx:X(11)+18,cy:Y(7),r:7,fill:"#777",class:"partVisual"});
  el("line",{x1:X(11)-15,y1:Y(7)-2,x2:X(11)+12,y2:Y(7)-12,stroke:"#333","stroke-width":4,class:"partVisual"});
  el("text",{x:X(11)-18,y:Y(7)+38,class:"label"},"スイッチ");

  // LED
  el("circle",{cx:X(17),cy:Y(9),r:32,class:"led"});
  el("line",{x1:X(17),y1:Y(8),x2:X(17),y2:Y(7),stroke:"#555","stroke-width":4});
  el("line",{x1:X(17),y1:Y(10),x2:X(17),y2:Y(11),stroke:"#555","stroke-width":4});
  el("text",{x:X(17)-15,y:Y(9)+50,class:"label"},"LED");

  // 電源端子
  el("circle",{cx:X(1),cy:Y(2),r:8,fill:"#4caf50",stroke:"#286c31","stroke-width":2,class:"partVisual"});
  el("text",{x:X(1)-18,y:Y(2)-17,class:"label"},"＋");
  el("text",{x:X(1)-12,y:Y(2)+25,class:"small"},"電源");

  // -----------------------------
  // 配線
  // -----------------------------
  function drawWire(a,b, cls="wire"){
    // 見本に合わせて、斜めではなく直角の折れ線にする。
    const ax=X(a[0]), ay=Y(a[1]), bx=X(b[0]), by=Y(b[1]);
    let points;
    if(a[0]===b[0] || a[1]===b[1]){
      points=`${ax},${ay} ${bx},${by}`;
    } else {
      const mx=bx;
      points=`${ax},${ay} ${mx},${ay} ${bx},${by}`;
    }
    const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    p.setAttribute("points",points);
    p.setAttribute("class",cls);
    p.addEventListener("click", e=>{
      if(cls==="wire"){
        e.stopPropagation();
        const k=edgeKey(a,b);
        wires.delete(k);
        p.remove();
        update();
        status.textContent="配線を1本削除しました。";
        status.className="";
      }
    });
    svg.appendChild(p);
    return p;
  }

  function holeClick(p){
    if(selected===null){
      selected=p;
      holeMap.get(key(p)).classList.add("selected");
      status.textContent=`始点 ${p[0]+1},${p[1]+1} を選択中。終点をクリックしてください。`;
      return;
    }

    const first=selected;
    holeMap.get(key(first)).classList.remove("selected");
    selected=null;

    if(key(first)===key(p)){
      status.textContent="同じ穴は選べません。";
      return;
    }

    const k=edgeKey(first,p);
    if(wires.has(k)){
      status.textContent="その配線はすでにあります。";
      return;
    }

    if(solutionMap.has(k)){
      wires.set(k, solutionMap.get(k));
      drawWire(first,p);
      update();
      status.textContent="⭕ 正しい配線です！";
      status.className="ok";
      if(wires.size===solutionMap.size){
        status.textContent="🎉 完成！見本どおりの配線ができました！";
      }
    }else{
      mistakes++;
      status.textContent="❌ その2点は接続しません。もう一度。";
      status.className="ng";
    }
  }

  function update(){
    countEl.textContent=wires.size;
  }

  function clearWires(){
    document.querySelectorAll(".wire").forEach(e=>e.remove());
    wires.clear(); selected=null;
    document.querySelectorAll(".hole.selected").forEach(e=>e.classList.remove("selected"));
    status.textContent="配線を全部消しました。";
    status.className="";
    update();
  }

  function showHint(){
    hintOn=!hintOn;
    document.querySelectorAll(".ghost").forEach(e=>e.remove());
    if(hintOn){
      for(const [k,[a,b]] of solutionMap){
        if(!wires.has(k)) drawWire(a,b,"ghost");
      }
      status.textContent="オレンジの点線が未完成の配線です。";
    }else{
      status.textContent="ヒントを消しました。";
    }
  }

  function check(){
    if(wires.size===solutionMap.size){
      status.textContent=`🎉 正解！ ${solutionMap.size}本の配線が完成しました。ミス ${mistakes} 回。`;
      status.className="ok";
    }else{
      const left=solutionMap.size-wires.size;
      status.textContent=`まだ ${left} 本の配線が足りません。`;
      status.className="ng";
    }
  }

  document.getElementById("clear").addEventListener("click",clearWires);
  document.getElementById("hint").addEventListener("click",showHint);
  document.getElementById("check").addEventListener("click",check);

  update();
})();
</script>
</body>
</html>
